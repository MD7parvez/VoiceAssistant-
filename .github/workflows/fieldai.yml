name: Build Field AI local-LLM APK
on:
  workflow_dispatch:
  push:
    paths:
      - "fieldai/**"
      - ".github/workflows/fieldai.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Fetch llama.cpp source
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git fieldai/app/src/main/cpp/llama.cpp
      - name: Build ARM32 debug APK
        working-directory: fieldai
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: field-ai-local-ai-arm32-debug
          path: fieldai/app/build/outputs/apk/debug/app-debug.apk
